spring.application.name=mundo.peludo
port=8080

# Configuracion de la Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/mundo_peludo?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate (Para que cree las tablas solas)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion de Thymeleaf (Para que los cambios se vean al instante)
spring.thymeleaf.cache=false